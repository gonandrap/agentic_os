[project]
name = "jarvis-os"
version = "0.12.4"
description = "Jarvis — an agentic OS layer that orchestrates Claude Code sessions across your projects"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Gonzalo Raposo" }]
keywords = ["claude", "agents", "orchestration", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# Core is stdlib-only by design (argparse + sqlite3 + json).
dependencies = []

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-timeout>=2.3", "pytest-split>=0.9", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1",
       "python-multipart>=0.0.9", "httpx>=0.27", "playwright>=1.45"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# hung test dumps all thread tracebacks and dies; -q buffers, so CI otherwise burns whole job with no log
faulthandler_timeout = 120
