{# One pie drawn by the shared helper `JarvisChart.pie`; slices from `pie_slices`
   (docs/superpowers/specs/2026-11-09-cost-overview-first.md §3.1). `pie_script()` once per page. #}
{% macro pie(title, slices) -%}
<figure class="cost-pie" style="margin: 0;">
  <figcaption class="kv">{{ title }}</figcaption>
  {% if slices %}
  <svg class="pie-svg" width="340" height="{{ [124, slices|length * 16 + 20]|max }}"
       role="img" aria-label="{{ title }}"></svg>
  <script type="application/json" class="pie-data">{{ slices|tojson }}</script>
  {% else %}
  <p class="kv sub" style="margin: 4px 0 0;">nothing in this window</p>
  {% endif %}
</figure>
{%- endmacro %}

{% macro pie_script() -%}
<script src="/static/chart.js?v={{ static_v['chart.js'] }}"></script>
<script>
  document.querySelectorAll('figure.cost-pie').forEach(function (f) {
    var data = f.querySelector('script.pie-data');
    if (data) window.JarvisChart.pie(f.querySelector('svg'), JSON.parse(data.textContent),
                                     { cx: 56, cy: 60, r: 50 });
  });
</script>
{%- endmacro %}
