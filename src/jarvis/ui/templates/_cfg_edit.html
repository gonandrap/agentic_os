{# One setting's inline edit: `k` is a `config_rows` row, `here` the page to come back to #}
<form method="post" action="/config/set" class="cfg-edit">
  <input type="hidden" name="path" value="{{ k.path }}">
  <input type="hidden" name="back" value="{{ here }}">
  {% if k.widget == 'bool' %}
  <span class="cfg-val">{{ k.value|tojson }}</span>
  <input type="hidden" name="value" value="{{ 'false' if k.value else 'true' }}">
  {% elif k.widget == 'json' %}
  <textarea class="val mono" name="value" rows="2">{{ k.text }}</textarea>
  {% elif k.widget == 'number' %}
  <input class="val" type="number" step="any" name="value" value="{{ k.text }}">
  {% else %}
  <input class="val" type="text" name="value" value="{{ k.text }}">
  {% endif %}
  <input class="reason" type="text" name="reason"
         placeholder="{{ 'reason — required' if k.safety else 'reason — optional' }}">
  <button>{{ ('turn off' if k.value else 'turn on') if k.widget == 'bool' else 'Save' }}</button>
</form>
