name: ci
on:
  push:
    branches: [main]
  pull_request:

# All three jobs are REQUIRED status checks on main (enforced by the repo ruleset
# "protect-main"): unit tests, behavioral evals, and browser tests must pass before
# any merge.
#
# ONE INTERPRETER, deliberately (2026-09-19). This matrix held 3.11, 3.12 and 3.13 and
# ran the same suite three times, because `requires-python` said `>=3.11`. Nothing
# justified the promise: there is not one `sys.version_info` branch in `src/` or in
# `tests/`, and dev and production both run 3.13, so the two extra legs were the only
# place the OS had ever been run on 3.11 or 3.12. The promise was retired rather than
# kept: pyproject.toml now says `>=3.13`, install.sh probes for 3.13 alone, and
# `uv.lock` was re-locked, which dropped every cp311 and cp312 wheel. Reinstating a
# version here means reinstating it in all three, or CI is testing something the
# installer does not offer.
#
# It never cost much LATENCY — the legs ran in parallel, so ~7 minutes was ~7 minutes —
# and that is not why it went. It cost ~20 minutes of Actions compute a run to defend a
# claim nobody was making good on. Latency does matter now for a different reason: the
# OS holds a validation round until these checks report (`daemon._validation_ci_held`),
# so this workflow's wall clock is on every work order's critical path.
#
# THE MATRIX IS KEPT WITH ONE ENTRY, and that is not a leftover. A required status check
# is pinned BY NAME in the ruleset, and a matrix job's name carries its value — so
# `python-version: ["3.13"]` keeps the context `unit (3.13)`, exactly what the ruleset
# already required and exactly what every open pull request already reports. Collapsing
# to a bare `unit` would rename the context, and then the ruleset would demand a check
# that no branch built before the rename can ever produce: ten open pull requests,
# unmergeable until each was rebased. Dropping a version from this list is a ruleset
# edit (remove that context); renaming the job is a ruleset edit AND a rebase of
# everything in flight. Adding a version needs the ruleset to require it, or it is
# advisory only.
#
# SHARDED (2026-10-20). One serial `pytest tests` took >15 minutes. The suite now runs as
# `unit-shard` legs (pytest-split by test count) each using pytest-xdist, and the job that
# KEEPS the required name `unit (3.13)` is a tiny aggregator that fails if any shard did.
jobs:
  unit-shard:
    name: unit-shard (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests -q -n auto --timeout=60 --splits 8 --group ${{ matrix.group }}

  unit:
    name: unit (${{ matrix.python-version }})
    needs: unit-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only to cancel this run when the shards reached no verdict (issue #1649)
    permissions:
      actions: write
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      # A shard GitHub lost (`abandoned`, `cancelled`, `skipped`) judged nothing. Failing here
      # would read as red code and spend the OS's one failed-run re-run; cancelling makes the
      # run `cancelled`, which the OS re-runs on main (#1193) and on pull requests (#1123).
      - name: Every shard must have passed
        env:
          RESULT: ${{ needs.unit-shard.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RESULT" in
            success) exit 0 ;;
            failure) echo "::error::a unit shard failed"; exit 1 ;;
          esac
          echo "::error::unit shards ended '$RESULT', not 'failure': no verdict, cancelling this run"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          # The cancel lands asynchronously; exiting first would conclude `failure`
          sleep 120
          exit 1

  evals:
    # Deterministic behavioral scorecard for Jarvis + Neo (evals/README.md).
    # The LLM-graded layer (evals/llm) is opt-in and NOT run here: it spends
    # tokens and needs a logged-in Claude Code.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # In this required job so it blocks without a ruleset edit
      - name: Comments and docstrings stay one line
        run: |
          python scripts/trim_comments.py --check || {
            echo "::error::A comment or docstring is not in one-line form — over one line, or a trailing period the checker strips. The 'OVERLONG <path>' lines above name the files; rewrite each comment as one line yourself rather than letting 'scripts/trim_comments.py' truncate it."
            exit 1
          }
      - run: pytest evals -q -n auto --timeout=60
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard
          path: evals/results.json
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Install headless chromium
        # No --with-deps: the runner image already has chromium's libs; apt mirrors stalled this step (#1193, #1219, painforwisdom PR 123).
        timeout-minutes: 2
        run: playwright install --only-shell chromium
      - run: pytest tests_browser -q --timeout=60
